name: Deploy to VPS

# Le "cutover" se fait naturellement : ce workflow ne se déclenche que sur
# main, donc il ne prend effet qu'au merge de la réécriture — pas besoin d'y
# retoucher à ce moment-là.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/debian/projects/dle
            git pull origin main
            docker compose build
            docker compose run --rm migrate
            docker compose up -d
            docker image prune -f
