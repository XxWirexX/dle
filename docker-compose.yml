services:
  db:
    image: postgres:16-alpine
    container_name: dle_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=dle
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=dle
    volumes:
      - dle_db_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: runtime
    container_name: dle_web
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    # La route (sous-domaine, maintenance) est gérée par le panel admin
    # (vps-infra/admin) : il suffit que le conteneur soit sur le réseau proxy.
    networks:
      - proxy
      - default

  migrate:
    build:
      context: .
      target: migrate
    container_name: dle_migrate
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./legacy-content:/app/legacy-content:ro
    profiles:
      - tools

volumes:
  dle_db_data:

networks:
  proxy:
    external: true
